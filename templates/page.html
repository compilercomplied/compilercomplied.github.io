{% extends "base.html" %}

{% block title %}{{ page.title }} · {{ config.title }}{% endblock title %}

{% block content %}
<main class="reading-main">
    <article class="prose">
        <header>
            <h1>{{ page.title }}</h1>
            {% if page.date %}
            <time datetime="{{ page.date }}">{{ page.date | date(format="%d %B %Y") }}</time>
            {% endif %}
        </header>
        {{ page.content | safe }}
    </article>
</main>
{% endblock content %}
